<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maosun-dev</title>
<meta name="description" content="maosun-dev が作っているゲーム・アプリの一覧です。">
<link rel="icon" type="image/png" href="assets/tenrakuhai-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="site">
    <h1>maosun-dev</h1>
    <p class="lead">ゲームやアプリを作っています。</p>
  </header>

  <h2 class="sec">アプリ</h2>
  <article class="app">
    <img class="icon" src="assets/tenrakuhai-icon.png" alt="転落牌のアイコン" width="96" height="96">
    <div class="body">
      <h3>転落牌 <span class="kana">てんらくはい</span></h3>
      <p>積んで、そろえて、落とさない。麻雀牌を台の上に積み上げて役をつくるゲームです。</p>
      <ul class="links">
        <li><a class="btn primary" href="https://maosun-dev.github.io/tenrakuhai/">ブラウザで遊ぶ</a></li>
        <li><span class="btn disabled" aria-disabled="true">App Store（準備中）</span></li>
        <li><a class="btn" href="https://maosun-dev.github.io/tenrakuhai/privacy.html">プライバシーポリシー</a></li>
      </ul>
    </div>
  </article>

  <h2 class="sec">ツール</h2>
  <article class="app">
    <img class="icon" src="assets/tjasaifu-icon.png" alt="TJA採譜台のアイコン" width="96" height="96">
    <div class="body">
      <h3>TJA採譜台</h3>
      <p>曲を聞きながら叩いて、太鼓さん次郎などで遊べる譜面（TJA）を作るツールです。自動で譜面を作ることもできます。「太鼓の達人」シリーズの非公式なファンメイドツールです。</p>
      <ul class="links">
        <li><a class="btn primary" href="https://maosun-dev.github.io/tjasaifu/">ブラウザで使う</a></li>
      </ul>
    </div>
  </article>

  <footer><a href="support.html">サポート・お問い合わせ</a></footer>
</main>
</body>
</html>
